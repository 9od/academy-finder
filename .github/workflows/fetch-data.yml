name: 학원 데이터 수집

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: requests 설치
        run: pip install requests

      - name: 경기도 API에서 데이터 수집
        env:
          GG_API_KEY: ${{ secrets.GG_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests
          import json
          import os
          import time

          KEY = os.environ['GG_API_KEY']
          PAGE_SIZE = 1000
          MAX_PAGES = 20
          TARGET_COUNT = 300

          all_rows = []
          session = requests.Session()
          session.headers.update({'Accept-Encoding': 'identity'})

          for page in range(1, MAX_PAGES + 1):
              url = "https://openapi.gg.go.kr/TninsttInstutM"
              params = {'KEY': KEY, 'Type': 'json', 'pIndex': page, 'pSize': PAGE_SIZE}
              print(f"페이지 {page} 호출 중...")

              for attempt in range(3):
                  try:
                      res = session.get(url, params=params, timeout=60)
                      res.raise_for_status()
                      data = res.json()
                      break
                  except Exception as e:
                      print(f"  시도 {attempt+1} 실패: {e}")
                      if attempt < 2:
                          time.sleep(5)
                      else:
                          raise

              wrapper = data.get('TninsttInstutM')
              if not wrapper:
                  print("응답 없음, 종료")
                  break

              result_code = wrapper[0].get('head', [{}])[1].get('RESULT', {}).get('CODE', '')
              if result_code and result_code != 'INFO-000':
                  print(f"API 오류: {result_code}")
                  break

              rows = wrapper[1].get('row', []) if len(wrapper) > 1 else []
              if not rows:
                  print("데이터 없음, 종료")
                  break

              all_rows.extend(rows)

              yongin_count = sum(1 for r in all_rows if '용인' in (r.get('SIGUN_NM') or ''))
              print(f"  총 {len(all_rows)}개 수집, 용인시 {yongin_count}개")

              if yongin_count >= TARGET_COUNT:
                  print(f"용인시 {yongin_count}개 확보 완료")
                  break

              total = wrapper[0].get('head', [{}])[0].get('list_total_count', 0)
              if page * PAGE_SIZE >= total:
                  print("전체 데이터 수집 완료")
                  break

              time.sleep(1)

          yongin_rows = [r for r in all_rows if '용인' in (r.get('SIGUN_NM') or '')]
          print(f"\n최종 용인시 학원 수: {len(yongin_rows)}개")

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(yongin_rows, f, ensure_ascii=False, indent=2)

          print("data.json 저장 완료")
          PYEOF

      - name: data.json 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "데이터 업데이트: $(date '+%Y-%m-%d')"
          git push
