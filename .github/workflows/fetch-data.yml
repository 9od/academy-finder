name: 학원 데이터 수집

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: requests 설치
        run: pip install requests

      - name: NEIS 수집 + 카카오 지오코딩
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, time

          NEIS_KEY  = os.environ['NEIS_API_KEY']
          KAKAO_KEY = os.environ['KAKAO_API_KEY']

          # ── 1. NEIS에서 용인시 학원 전체 수집 ──
          BASE = "https://open.neis.go.kr/hub/acaInsTiInfo"
          PAGE_SIZE = 1000
          all_rows, page = [], 1

          while True:
              params = {
                  'KEY': NEIS_KEY, 'Type': 'json',
                  'pIndex': page, 'pSize': PAGE_SIZE,
                  'ATPT_OFCDC_SC_CODE': 'J10',
                  'ADMST_ZONE_NM': '용인시',
              }
              print(f"NEIS 페이지 {page} 호출 중...")
              for attempt in range(3):
                  try:
                      res = requests.get(BASE, params=params, timeout=30)
                      data = res.json()
                      break
                  except Exception as e:
                      print(f"  재시도 {attempt+1}: {e}")
                      time.sleep(3)

              wrapper = data.get('acaInsTiInfo', [])
              if not wrapper: break
              code = wrapper[0].get('head',[{}])[1].get('RESULT',{}).get('CODE','')
              if code != 'INFO-000': break
              rows = wrapper[1].get('row', []) if len(wrapper) > 1 else []
              if not rows: break
              all_rows.extend(rows)
              total = wrapper[0].get('head',[{}])[0].get('list_total_count', 0)
              print(f"  {len(all_rows)}/{total}개")
              if len(all_rows) >= total or len(rows) < PAGE_SIZE: break
              page += 1
              time.sleep(1)

          # 수지구 개원 중인 곳만
          suji = [r for r in all_rows
                  if r.get('REG_STTUS_NM') == '개원'
                  and '수지구' in (r.get('FA_RDNMA') or '')]
          print(f"\n수지구 개원 학원: {len(suji)}개")

          # ── 2. 카카오 지오코딩 ──
          GEO_URL = "https://dapi.kakao.com/v2/local/search/address.json"
          headers = {"Authorization": f"KakaoAK {KAKAO_KEY}"}

          geo_cache = {}

          def geocode(addr):
              if not addr or addr in geo_cache:
                  return geo_cache.get(addr)
              try:
                  r = requests.get(GEO_URL, headers=headers,
                                   params={"query": addr}, timeout=10)
                  docs = r.json().get('documents', [])
                  if docs:
                      result = {"lat": float(docs[0]['y']), "lng": float(docs[0]['x'])}
                      geo_cache[addr] = result
                      return result
              except Exception as e:
                  print(f"  지오코딩 실패 ({addr[:20]}): {e}")
              geo_cache[addr] = None
              return None

          print("\n카카오 지오코딩 시작...")
          for i, r in enumerate(suji):
              addr = (r.get('FA_RDNMA') or '').strip()
              if addr:
                  coords = geocode(addr)
                  if coords:
                      r['LAT'] = coords['lat']
                      r['LNG'] = coords['lng']
              if (i+1) % 50 == 0:
                  print(f"  {i+1}/{len(suji)} 완료")
              time.sleep(0.05)  # API 부하 방지

          geocoded = sum(1 for r in suji if r.get('LAT'))
          print(f"좌표 확보: {geocoded}/{len(suji)}개")

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(suji, f, ensure_ascii=False, indent=2)
          print("data.json 저장 완료")
          PYEOF

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "데이터 업데이트: $(date '+%Y-%m-%d')"
          git push
