<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수지구 학원 찾기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #1D9E75; --teal-dark: #0F6E56;
      --bg: #f8f7f4; --surface: #ffffff;
      --border: #e8e6e0; --border-hover: #c8c6c0;
      --text-primary: #1a1a18; --text-secondary: #6b6a66; --text-muted: #9b9a96;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
    header h1 { font-size: 15px; font-weight: 600; }
    header span { font-size: 13px; color: var(--text-muted); margin-left: 4px; }
    .layout { max-width: 1100px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; padding: 16px; } }
    .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; position: sticky; top: 72px; }
    .sidebar-section { margin-bottom: 20px; }
    .sidebar-section:last-child { margin-bottom: 0; }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { cursor: pointer; padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); transition: all 0.12s; user-select: none; }
    .chip:hover { border-color: var(--teal); color: var(--teal); }
    .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Pretendard', sans-serif; color: var(--text-primary); background: var(--bg); outline: none; cursor: pointer; }
    .search-btn { width: 100%; padding: 11px; background: var(--teal); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: background 0.15s; margin-top: 4px; }
    .search-btn:hover { background: var(--teal-dark); }
    .main { min-height: 400px; }
    .stats-bar { display: flex; align-items: center; margin-bottom: 16px; min-height: 28px; gap: 12px; }
    .stats-text { font-size: 13px; color: var(--text-secondary); }
    .stats-text strong { color: var(--text-primary); }
    .updated-text { font-size: 11px; color: var(--text-muted); }
    .search-bar { margin-bottom: 16px; }
    .search-bar input { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Pretendard', sans-serif; background: var(--surface); outline: none; transition: border-color 0.15s; }
    .search-bar input:focus { border-color: var(--teal); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; transition: border-color 0.15s, transform 0.1s; }
    .card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .card-name { font-size: 14px; font-weight: 600; color: var(--text-primary); line-height: 1.4; }
    .subject-badge { font-size: 11px; padding: 3px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; font-weight: 500; }
    .card-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 6px; }
    .card-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
    .card-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .card-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .card-footer { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); }
    .s-eng   { background: #E1F5EE; color: #0F6E56; }
    .s-math  { background: #E6F1FB; color: #185FA5; }
    .s-art   { background: #FAEEDA; color: #854F0B; }
    .s-music { background: #FBEAF0; color: #993556; }
    .s-sports{ background: #FAECE7; color: #993C1D; }
    .s-etc   { background: #F1EFE8; color: #5F5E5A; }
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; color: var(--text-muted); text-align: center; }
    .state-box .icon { font-size: 36px; }
    .state-box p { font-size: 14px; line-height: 1.6; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { padding: 14px 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm); font-size: 13px; color: #b91c1c; line-height: 1.6; }
    .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .page-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; background: var(--surface); color: var(--text-secondary); font-family: 'Pretendard', sans-serif; transition: all 0.12s; }
    .page-btn:hover { border-color: var(--teal); color: var(--teal); }
    .page-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; }
  </style>
</head>
<body>
<header>
  <div class="logo-dot"></div>
  <h1>수지구 학원 찾기</h1>
  <span>경기도 공공데이터 기반</span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-title">교습 과목</div>
      <div class="chips" id="subjectChips">
        <div class="chip on" data-v="영어">영어</div>
        <div class="chip" data-v="수학">수학</div>
        <div class="chip" data-v="미술">미술</div>
        <div class="chip" data-v="음악">음악·피아노</div>
        <div class="chip" data-v="태권도">태권도</div>
        <div class="chip" data-v="수영">수영</div>
        <div class="chip" data-v="코딩">코딩·로봇</div>
        <div class="chip" data-v="독서">독서·논술</div>
        <div class="chip" data-v="과학">과학</div>
        <div class="chip" data-v="체육">체육</div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="section-title">지역</div>
      <select id="sigunSel" onchange="applyFilter()">
        <option value="용인시">용인시 전체</option>
        <option value="수지구" selected>용인시 수지구</option>
      </select>
    </div>
    <button class="search-btn" onclick="applyFilter()">검색하기</button>
  </aside>
  <main class="main">
    <div class="search-bar">
      <input type="text" id="nameFilter" placeholder="학원명으로 직접 검색..." oninput="applyFilter()" />
    </div>
    <div class="stats-bar">
      <div class="stats-text" id="statsText"></div>
      <div class="updated-text" id="updatedText"></div>
    </div>
    <div id="content">
      <div class="state-box"><div class="spinner"></div><p>데이터 불러오는 중...</p></div>
    </div>
    <div class="pagination" id="paginationArea"></div>
  </main>
</div>
<script>
let allRows = [];
let currentPage = 1;
const PER_PAGE = 20;

const SUBJECT_MAP = {
  '영어': ['영어', 'english', '잉글', '어학'],
  '수학': ['수학', 'math', '매쓰'],
  '미술': ['미술', '아트', '그림', '드로잉'],
  '음악': ['음악', '피아노', '바이올린', '첼로', '플루트'],
  '태권도': ['태권도'],
  '수영': ['수영'],
  '코딩': ['코딩', '로봇', '컴퓨터', 'sw', '소프트웨어'],
  '독서': ['독서', '논술', '글쓰기', '국어'],
  '과학': ['과학', '사이언스'],
  '체육': ['체육', '스포츠', '축구', '농구', '발레', '댄스'],
};

function subjectBadge(name) {
  const t = (name || '').toLowerCase();
  if (/영어|english|잉글|어학/.test(t))           return ['영어', 's-eng'];
  if (/수학|math|매쓰/.test(t))                   return ['수학', 's-math'];
  if (/미술|아트|그림/.test(t))                    return ['미술', 's-art'];
  if (/음악|피아노|바이올린|첼로|플루트/.test(t))   return ['음악', 's-music'];
  if (/태권도|수영|체육|스포츠|축구|댄스|발레/.test(t)) return ['체육·스포츠', 's-sports'];
  if (/코딩|로봇|컴퓨터|소프트/.test(t))            return ['코딩', 's-math'];
  if (/과학|사이언스/.test(t))                     return ['과학', 's-etc'];
  if (/독서|논술|국어|글쓰기/.test(t))              return ['독서·국어', 's-etc'];
  return ['기타', 's-etc'];
}

// 페이지 로드 시 data.json 읽기
window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#subjectChips .chip').forEach(c => {
    c.addEventListener('click', () => { c.classList.toggle('on'); applyFilter(); });
  });
  loadData();
});

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('data.json을 찾을 수 없습니다.');
    allRows = await res.json();

    // 업데이트 시각 표시 (Last-Modified 헤더)
    const lastMod = res.headers.get('Last-Modified');
    if (lastMod) {
      const d = new Date(lastMod);
      document.getElementById('updatedText').textContent =
        `최종 업데이트: ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    applyFilter();
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="error-box">
        데이터 파일(data.json)을 불러올 수 없습니다.<br>
        GitHub Actions가 아직 실행되지 않았을 수 있습니다.<br>
        repo → Actions 탭 → "학원 데이터 수집" → Run workflow 버튼을 눌러주세요.
      </div>`;
  }
}

function applyFilter() {
  const on = [...document.querySelectorAll('#subjectChips .chip.on')].map(c => c.dataset.v);
  const keywords = [];
  on.forEach(s => (SUBJECT_MAP[s] || [s]).forEach(k => keywords.push(k)));

  const nameQ = document.getElementById('nameFilter').value.trim().toLowerCase();
  const sigunVal = document.getElementById('sigunSel').value;

  const filtered = allRows.filter(r => {
    const addr = r.REFINE_ROADNM_ADDR || r.REFINE_LOTNO_ADDR || '';
    if (sigunVal === '수지구' && !addr.includes('수지')) return false;

    const nm = (r.FACLT_NM || '').toLowerCase();
    if (nameQ && !nm.includes(nameQ)) return false;
    if (keywords.length === 0) return true;
    return keywords.some(k => nm.includes(k.toLowerCase()));
  });

  currentPage = 1;
  renderResults(filtered);
}

function renderResults(filtered) {
  const total = filtered.length;
  document.getElementById('statsText').innerHTML =
    total > 0 ? `<strong>${total.toLocaleString()}개</strong> 학원` : '';

  if (total === 0) {
    document.getElementById('content').innerHTML = `
      <div class="state-box">
        <div class="icon">🔍</div>
        <p>검색 결과가 없습니다.<br>과목 선택이나 지역을 바꿔보세요.</p>
      </div>`;
    document.getElementById('paginationArea').innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PER_PAGE;
  const pageData = filtered.slice(start, start + PER_PAGE);

  const cards = pageData.map(r => {
    const name  = r.FACLT_NM || '학원명 없음';
    const cours = r.CRSE_CLASS_NM || '';
    const addr  = r.REFINE_ROADNM_ADDR || r.REFINE_LOTNO_ADDR || '';
    const tel   = r.TELNO || '';
    const dong  = r.EMD_NM || '';
    const [label, cls] = subjectBadge(name);
    return `<div class="card">
      <div class="card-header">
        <div class="card-name">${name}</div>
        <span class="subject-badge ${cls}">${label}</span>
      </div>
      ${cours ? `<div class="card-row"><span class="card-icon">📚</span><span class="card-text">${cours}</span></div>` : ''}
      ${addr  ? `<div class="card-row"><span class="card-icon">📍</span><span class="card-text">${addr}</span></div>` : ''}
      ${tel   ? `<div class="card-row"><span class="card-icon">📞</span><span class="card-text">${tel}</span></div>` : ''}
      <hr class="card-divider" />
      <div class="card-footer">
        ${dong ? `<span class="tag">${dong}</span>` : ''}
        ${r.SIGUN_NM ? `<span class="tag">${r.SIGUN_NM}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="cards">${cards}</div>`;

  // 페이지네이션
  const totalPages = Math.ceil(total / PER_PAGE);
  if (totalPages <= 1) { document.getElementById('paginationArea').innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i}, event)">${i}</button>`;
  }
  document.getElementById('paginationArea').innerHTML = html;

  // filtered를 goPage에서 쓰기 위해 저장
  window._filtered = filtered;
}

function goPage(p, e) {
  currentPage = p;
  renderResults(window._filtered);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
