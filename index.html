<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수지구 학원 찾기</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--teal:#1D9E75;--teal-dark:#0F6E56;--bg:#f8f7f4;--surface:#fff;--border:#e8e6e0;--border-h:#c8c6c0;--t1:#1a1a18;--t2:#6b6a66;--t3:#9b9a96;--r-sm:8px;--r-md:12px;--r-lg:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
    header h1{font-size:15px;font-weight:600}
    header span{font-size:13px;color:var(--t3);margin-left:4px}
    .layout{max-width:1100px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
    @media(max-width:720px){.layout{grid-template-columns:1fr;padding:16px}.sidebar{position:static;top:auto}.sidebar-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0}.sidebar-toggle h2{font-size:13px;font-weight:600;color:var(--t1)}.sidebar-toggle .arrow{font-size:11px;color:var(--t3);transition:transform .2s}.sidebar-toggle.open .arrow{transform:rotate(180deg)}.sidebar-body{display:none;margin-top:16px}.sidebar-body.open{display:block}}@media(min-width:721px){.sidebar-toggle{display:none}.sidebar-body{display:block !important}}
    .sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:sticky;top:72px}
    .sec{margin-bottom:20px}
    .sec:last-child{margin-bottom:0}
    .sec-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:10px}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{cursor:pointer;padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--t2);transition:all .12s;user-select:none}
    .chip:hover{border-color:var(--teal);color:var(--teal)}
    .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
    select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:'Pretendard',sans-serif;color:var(--t1);background:var(--bg);outline:none;cursor:pointer}
    .btn{width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;font-family:'Pretendard',sans-serif;cursor:pointer;transition:background .15s;margin-top:4px}
    .btn:hover{background:var(--teal-dark)}
    .main{min-height:400px}
    .top-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .stats{font-size:13px;color:var(--t2)}
    .stats strong{color:var(--t1)}
    .updated{font-size:11px;color:var(--t3)}
    .searchbar{margin-bottom:16px}
    .searchbar input{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;font-family:'Pretendard',sans-serif;background:var(--surface);outline:none;transition:border-color .15s}
    .searchbar input:focus{border-color:var(--teal)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;transition:border-color .15s,transform .1s}
    .card:hover{border-color:var(--border-h);transform:translateY(-1px)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
    .card-name{font-size:14px;font-weight:600;color:var(--t1);line-height:1.4}
    .badge{font-size:11px;padding:3px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0;font-weight:500}
    .row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
    .ico{font-size:13px;flex-shrink:0;margin-top:1px}
    .txt{font-size:12px;color:var(--t2);line-height:1.5}
    .divider{border:none;border-top:1px solid var(--border);margin:10px 0}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:11px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:6px;border:1px solid var(--border)}
    .dist-badge{display:flex;align-items:center;gap:4px;background:#E1F5EE;border-radius:var(--r-sm);padding:5px 10px;white-space:nowrap;flex-shrink:0}
    .dist-badge .km{font-size:13px;font-weight:600;color:#0F6E56}
    .dist-badge .travel{font-size:11px;color:#1D9E75}
    .no-dist{font-size:11px;color:var(--t3)}
    .s-eng{background:#E1F5EE;color:#0F6E56}
    .s-math{background:#E6F1FB;color:#185FA5}
    .s-art{background:#FAEEDA;color:#854F0B}
    .s-music{background:#FBEAF0;color:#993556}
    .s-sports{background:#FAECE7;color:#993C1D}
    .s-etc{background:#F1EFE8;color:#5F5E5A}
    .state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--t3);text-align:center}
    .state .ico2{font-size:36px}
    .state p{font-size:14px;line-height:1.6}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r-sm);font-size:13px;color:#b91c1c;line-height:1.6}
    .pages{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap}
    .pg{padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;cursor:pointer;background:var(--surface);color:var(--t2);font-family:'Pretendard',sans-serif;transition:all .12s}
    .pg:hover{border-color:var(--teal);color:var(--teal)}
    .pg.on{background:var(--teal);border-color:var(--teal);color:#fff}
  </style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>수지구 학원 찾기</h1>
  <span>나이스 교육정보 기반</span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-toggle" onclick="toggleSidebar(this)">
      <h2>🔍 검색 필터</h2>
      <span class="arrow">▼</span>
    </div>
    <div class="sidebar-body">
    <div class="sec">
      <div class="sec-title">교습 계열</div>
      <div class="chips" id="realmChips">
        <div class="chip on" data-v="보습">보습·교과</div>
        <div class="chip" data-v="예능">예능</div>
        <div class="chip" data-v="체육">체육</div>
        <div class="chip" data-v="기술">기술·직업</div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">교습 과목 키워드</div>
      <div class="chips" id="subjectChips">
        <div class="chip" data-v="영어">영어</div>
        <div class="chip" data-v="수학">수학</div>
        <div class="chip" data-v="미술">미술</div>
        <div class="chip" data-v="음악">음악·피아노</div>
        <div class="chip" data-v="태권도">태권도</div>
        <div class="chip" data-v="수영">수영</div>
        <div class="chip" data-v="코딩">코딩·로봇</div>
        <div class="chip" data-v="논술">독서·논술</div>
        <div class="chip" data-v="과학">과학</div>
        <div class="chip" data-v="국어">국어</div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">동 선택</div>
      <select id="dongSel" onchange="applyFilter()">
        <option value="">수지구 전체</option>
        <option value="풍덕천동">풍덕천동</option>
        <option value="성복동">성복동</option>
        <option value="신봉동">신봉동</option>
        <option value="상현동">상현동</option>
        <option value="죽전동">죽전동</option>
        <option value="동천동">동천동</option>
        <option value="고기동">고기동</option>
      </select>
    </div>
    <div class="sec">
      <div class="sec-title">정렬</div>
      <select id="sortSel" onchange="applyFilter()">
        <option value="dist">집에서 가까운 순</option>
        <option value="name">학원명 가나다순</option>
      </select>
    </div>
    <button class="btn" onclick="applyFilter()">검색하기</button>
    </div>
  </aside>
  <main class="main">
    <div class="searchbar">
      <input type="text" id="nameQ" placeholder="학원명 또는 과목으로 검색..." oninput="applyFilter()" />
    </div>
    <div class="top-bar">
      <div class="stats" id="stats"></div>
      <div class="updated" id="updated"></div>
    </div>
    <div id="content">
      <div class="state"><div class="spinner"></div><p>데이터 불러오는 중...</p></div>
    </div>
    <div class="pages" id="pages"></div>
  </main>
</div>
<script>
// ── 집 좌표 (이편한세상 수지) ──
const HOME = { lat: 37.3213, lng: 127.0961 };

let allRows = [];
let _filtered = [];
let currentPage = 1;
const PER = 20;

// Haversine 직선거리 (km)
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 도보/차량 시간 추정
function travelTime(km) {
  const walk = Math.round(km / 4 * 60);   // 4km/h
  const car  = Math.round(km / 25 * 60);  // 25km/h (시내)
  return { walk, car };
}

const REALM_MAP = {
  '보습': ['입시','보습','교과'],
  '예능': ['예능','미술','음악'],
  '체육': ['체육','무도','스포츠'],
  '기술': ['기술','직업','컴퓨터','정보'],
};
const SUBJECT_MAP = {
  '영어': ['영어'], '수학': ['수학'], '미술': ['미술'],
  '음악': ['음악','피아노','바이올린','첼로'],
  '태권도': ['태권도'], '수영': ['수영'],
  '코딩': ['코딩','로봇','컴퓨터','sw'],
  '논술': ['논술','독서','글쓰기'],
  '과학': ['과학'], '국어': ['국어'],
};

function badgeInfo(row) {
  const realm = row.REALM_SC_NM || '';
  const crse  = (row.LE_CRSE_LIST_NM || row.LE_CRSE_NM || '').toLowerCase();
  const name  = (row.ACA_NM || '').toLowerCase();
  const s = realm + crse + name;
  if (/영어/.test(s))                       return ['영어','s-eng'];
  if (/수학/.test(s))                       return ['수학','s-math'];
  if (/미술|아트/.test(s))                  return ['미술','s-art'];
  if (/음악|피아노|바이올린/.test(s))        return ['음악','s-music'];
  if (/체육|태권도|수영|무도|댄스|발레/.test(s)) return ['체육·스포츠','s-sports'];
  if (/코딩|로봇|컴퓨터|sw/.test(s))        return ['코딩','s-math'];
  if (/과학/.test(s))                       return ['과학','s-etc'];
  if (/논술|독서|국어/.test(s))             return ['독서·국어','s-etc'];
  return [realm || '기타','s-etc'];
}

window.addEventListener('DOMContentLoaded', () => {
  [...document.querySelectorAll('.chips .chip')].forEach(c =>
    c.addEventListener('click', () => { c.classList.toggle('on'); applyFilter(); })
  );
  loadData();
});

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('data.json 없음');
    allRows = await res.json();
    const lm = res.headers.get('Last-Modified');
    if (lm) {
      const d = new Date(lm);
      document.getElementById('updated').textContent =
        `최종 업데이트: ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }
    applyFilter();
  } catch(e) {
    document.getElementById('content').innerHTML = `
      <div class="err">data.json을 불러올 수 없습니다.<br>
      repo → Actions → "학원 데이터 수집" → <strong>Run workflow</strong> 를 눌러 데이터를 먼저 수집해주세요.</div>`;
  }
}

function applyFilter() {
  const realmOn   = [...document.querySelectorAll('#realmChips .chip.on')].map(c => c.dataset.v);
  const subjectOn = [...document.querySelectorAll('#subjectChips .chip.on')].map(c => c.dataset.v);
  const dong  = document.getElementById('dongSel').value;
  const sortV = document.getElementById('sortSel').value;
  const q     = document.getElementById('nameQ').value.trim().toLowerCase();

  _filtered = allRows.filter(r => {
    const addr  = (r.FA_RDNMA || '') + (r.FA_RDNDA || '');
    const realm = r.REALM_SC_NM || '';
    const crse  = (r.LE_CRSE_LIST_NM || r.LE_CRSE_NM || '').toLowerCase();
    const name  = (r.ACA_NM || '').toLowerCase();

    if (dong && !addr.includes(dong)) return false;

    if (realmOn.length > 0) {
      const kws = realmOn.flatMap(v => REALM_MAP[v] || [v]);
      if (!kws.some(k => realm.includes(k))) return false;
    }
    if (subjectOn.length > 0) {
      const kws = subjectOn.flatMap(v => SUBJECT_MAP[v] || [v]);
      if (!kws.some(k => (name + crse).includes(k.toLowerCase()))) return false;
    }
    if (q && !name.includes(q) && !crse.includes(q) && !addr.toLowerCase().includes(q)) return false;
    return true;
  });

  // 거리 계산 추가
  _filtered.forEach(r => {
    if (r.LAT && r.LNG) {
      r._dist = distKm(HOME.lat, HOME.lng, r.LAT, r.LNG);
    } else {
      r._dist = null;
    }
  });

  // 정렬
  if (sortV === 'dist') {
    _filtered.sort((a, b) => {
      if (a._dist === null && b._dist === null) return 0;
      if (a._dist === null) return 1;
      if (b._dist === null) return -1;
      return a._dist - b._dist;
    });
  } else {
    _filtered.sort((a, b) => (a.ACA_NM || '').localeCompare(b.ACA_NM || '', 'ko'));
  }

  currentPage = 1;
  render();
}

function render() {
  const total = _filtered.length;
  document.getElementById('stats').innerHTML =
    total > 0 ? `<strong>${total.toLocaleString()}개</strong> 학원` : '';

  if (total === 0) {
    document.getElementById('content').innerHTML =
      `<div class="state"><div class="ico2">🔍</div><p>검색 결과가 없습니다.<br>조건을 바꿔보세요.</p></div>`;
    document.getElementById('pages').innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PER;
  const cards = _filtered.slice(start, start + PER).map(r => {
    const name  = r.ACA_NM || '';
    const realm = r.REALM_SC_NM || '';
    const crse  = [r.LE_CRSE_LIST_NM, r.LE_CRSE_NM].filter(Boolean).join(' · ');
    const addr  = [r.FA_RDNMA, r.FA_RDNDA].filter(Boolean).join(' ');
    const tel   = (r.FA_TELNO || '').replace(/null/gi,'').trim();
    const [label, cls] = badgeInfo(r);

    let distHtml = '';
    if (r._dist !== null) {
      const km = r._dist;
      const { walk, car } = travelTime(km);
      const kmStr = km < 1 ? `${Math.round(km*1000)}m` : `${km.toFixed(1)}km`;
      distHtml = `<div class="dist-badge">
        <span class="km">${kmStr}</span>
        <span class="travel">🚶${walk}분 · 🚗${car}분</span>
      </div>`;
    } else {
      distHtml = `<span class="no-dist">위치 정보 없음</span>`;
    }

    return `<div class="card">
      <div class="card-head">
        <div class="card-name">${name}</div>
        <span class="badge ${cls}">${label}</span>
      </div>
      ${crse ? `<div class="row"><span class="ico">📚</span><span class="txt">${crse}</span></div>` : ''}
      ${addr  ? `<div class="row"><span class="ico">📍</span><span class="txt">${addr}</span></div>` : ''}
      ${tel   ? `<div class="row"><span class="ico">📞</span><span class="txt">${tel}</span></div>` : ''}
      <hr class="divider"/>
      <div class="card-bottom">
        <div class="tags">
          ${realm ? `<span class="tag">${realm}</span>` : ''}
          ${r.ACA_INSTI_SC_NM ? `<span class="tag">${r.ACA_INSTI_SC_NM}</span>` : ''}
          ${r.TOFOR_SMTOT > 0 ? `<span class="tag">정원 ${r.TOFOR_SMTOT}명</span>` : ''}
        </div>
        ${distHtml}
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="cards">${cards}</div>`;

  const totalPages = Math.ceil(total / PER);
  if (totalPages <= 1) { document.getElementById('pages').innerHTML = ''; return; }
  document.getElementById('pages').innerHTML = Array.from({length: totalPages}, (_,i) =>
    `<button class="pg${i+1===currentPage?' on':''}" onclick="goPage(${i+1})">${i+1}</button>`
  ).join('');
}

function toggleSidebar(el) {
  el.classList.toggle('open');
  document.querySelector('.sidebar-body').classList.toggle('open');
}

function goPage(p) {
  currentPage = p;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
